<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b30" />
    <meta name="description" content="Bring restaurant billing, kitchen orders, tables and operations into one connected workflow with Spicyhub. Request a 7-day trial." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://spicyhub.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spicyhub" />
    <meta property="og:title" content="Spicyhub — Restaurant OS" />
    <meta property="og:description" content="Less chaos. More hospitality. Connect restaurant billing, kitchen orders, tables and operations." />
    <meta property="og:url" content="https://spicyhub.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Spicyhub — Restaurant OS" />
    <meta name="twitter:description" content="Less chaos. More hospitality. Connect restaurant billing, kitchen orders, tables and operations." />
    <title>Spicyhub — Restaurant OS</title>
    <script type="module" src="/assets/index-BuT3_RdM.js"></script>
    <link rel="stylesheet" href="/assets/index-ChC44jz0.css">
    <style>
      .visual-glow {
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Floating Quick Access Dock with Free Trial, Direct Sign-Up & Login -->
    <div style="position:fixed; bottom:24px; right:24px; z-index:99999; display:flex; gap:10px; align-items:center; background:rgba(23,33,30,0.95); backdrop-filter:blur(10px); padding:8px 16px; border-radius:40px; border:1px solid rgba(255,255,255,0.22); box-shadow:0 12px 32px rgba(0,0,0,0.35); font-family:'DM Sans',-apple-system,sans-serif;">
      <button onclick="window.triggerTrialModal()" style="background:#ff6b35; color:#fff; border:none; padding:8px 16px; border-radius:24px; font-size:12px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:6px; transition:transform 0.15s ease;">
        🎁 <span>7-Day Free Trial</span>
      </button>
      <button onclick="document.getElementById('directSignupModal').style.display='flex'" style="background:#16a34a; color:#fff; border:none; padding:8px 16px; border-radius:24px; font-size:12px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:6px; transition:transform 0.15s ease;">
        ⚡ <span>Direct Sign Up</span>
      </button>
      <a href="/dashboard" style="color:#fff; background:rgba(255,255,255,0.12); text-decoration:none; font-size:12px; font-weight:800; padding:8px 14px; border-radius:24px; display:flex; align-items:center; gap:6px;">
        🔑 <span>Enter Restaurant OS →</span>
      </a>
    </div>

    <!-- Direct Sign Up Modal (Option 2: No trial required) -->
    <div id="directSignupModal" style="display:none; position:fixed; inset:0; z-index:999999; background:rgba(18,27,24,0.7); backdrop-filter:blur(6px); justify-content:center; align-items:center; padding:16px;">
      <div style="background:#fff; border-radius:16px; max-width:480px; width:100%; padding:28px; box-shadow:0 20px 40px rgba(0,0,0,0.25); position:relative; font-family:'DM Sans',-apple-system,sans-serif;">
        <button onclick="document.getElementById('directSignupModal').style.display='none'" style="position:absolute; top:18px; right:18px; border:none; background:transparent; font-size:24px; cursor:pointer; color:#6b7771; line-height:1;">&times;</button>
        
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="background:#16a34a; color:#fff; font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase;">Option 2: Direct Access</span>
          <span style="font-size:12px; color:#16a34a; font-weight:700;">No Trial Needed · Instant Setup</span>
        </div>
        
        <h2 style="font-size:22px; font-weight:800; color:#17211e; margin-bottom:6px; font-family:'Manrope',sans-serif;">Direct Restaurant Registration</h2>
        <p style="font-size:13px; color:#6b7771; margin-bottom:20px; line-height:1.4;">
          Skip the 7-day trial and launch your restaurant operations immediately with full master access.
        </p>

        <form id="directSignupFormHome" onsubmit="handleHomeDirectSignup(event)">
          <div style="margin-bottom:12px;">
            <label style="display:block; font-size:12px; font-weight:700; color:#17211e; margin-bottom:4px;">Restaurant Brand Name</label>
            <input type="text" id="homeRestName" required placeholder="e.g. Royal Spice Bistro" style="width:100%; padding:10px 12px; border:1px solid #e7e9e3; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </div>

          <div style="margin-bottom:12px;">
            <label style="display:block; font-size:12px; font-weight:700; color:#17211e; margin-bottom:4px;">Owner / Manager Name</label>
            <input type="text" id="homeOwnerName" required placeholder="e.g. Rahul Sharma" style="width:100%; padding:10px 12px; border:1px solid #e7e9e3; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </div>

          <div style="margin-bottom:12px;">
            <label style="display:block; font-size:12px; font-weight:700; color:#17211e; margin-bottom:4px;">Work Email</label>
            <input type="email" id="homeEmail" required placeholder="e.g. rahul@royalspice.com" style="width:100%; padding:10px 12px; border:1px solid #e7e9e3; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </div>

          <div style="margin-bottom:12px;">
            <label style="display:block; font-size:12px; font-weight:700; color:#17211e; margin-bottom:4px;">Password</label>
            <input type="password" id="homePassword" required minlength="4" placeholder="Minimum 4 characters" style="width:100%; padding:10px 12px; border:1px solid #e7e9e3; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
            <div>
              <label style="display:block; font-size:12px; font-weight:700; color:#17211e; margin-bottom:4px;">City</label>
              <input type="text" id="homeCity" value="Jaipur" placeholder="Jaipur" style="width:100%; padding:10px 12px; border:1px solid #e7e9e3; border-radius:8px; font-size:14px; box-sizing:border-box;">
            </div>
            <div>
              <label style="display:block; font-size:12px; font-weight:700; color:#17211e; margin-bottom:4px;">Select Plan</label>
              <select id="homePlan" style="width:100%; padding:10px 12px; border:1px solid #e7e9e3; border-radius:8px; font-size:13px; box-sizing:border-box;">
                <option value="Pro Multi-Outlet">Pro (₹4,999/mo)</option>
                <option value="Starter POS">Starter (₹1,999/mo)</option>
                <option value="Enterprise Cloud">Enterprise (₹12,999/mo)</option>
              </select>
            </div>
          </div>

          <div id="homeSignupAlert" style="display:none; padding:10px; border-radius:8px; margin-bottom:12px; font-size:13px; background:#fee2e2; color:#b91c1c;"></div>

          <button type="submit" id="homeSignupBtn" style="width:100%; background:#16a34a; color:#fff; font-weight:800; font-size:14px; padding:12px; border:none; border-radius:8px; cursor:pointer; font-family:'Manrope',sans-serif;">
            Create Account & Enter Restaurant OS →
          </button>
        </form>

        <div style="text-align:center; margin-top:14px; font-size:12px; color:#6b7771;">
          Prefer 7-day free trial? <a href="javascript:void(0)" onclick="document.getElementById('directSignupModal').style.display='none'; window.triggerTrialModal();" style="color:#ff6b35; font-weight:700;">Fill Free Trial Form instead ↗</a>
        </div>
      </div>
    </div>

    <script>
      window.triggerTrialModal = function() {
        const btns = Array.from(document.querySelectorAll('button'));
        const trialBtn = btns.find(b => (b.textContent && (b.textContent.includes('Try Spicyhub free for 7 days') || b.textContent.includes('Get started'))) && !b.closest('.homepage-access-bar'));
        if (trialBtn) {
          trialBtn.click();
        } else {
          // If modal trigger not found in DOM yet, scroll to top
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      async function handleHomeDirectSignup(e) {
        e.preventDefault();
        const alertBox = document.getElementById('homeSignupAlert');
        alertBox.style.display = 'none';

        const restaurantName = document.getElementById('homeRestName').value.trim();
        const ownerName = document.getElementById('homeOwnerName').value.trim();
        const email = document.getElementById('homeEmail').value.trim();
        const password = document.getElementById('homePassword').value.trim();
        const city = document.getElementById('homeCity').value.trim() || 'Jaipur';
        const plan = document.getElementById('homePlan').value;
        const btn = document.getElementById('homeSignupBtn');

        if (!restaurantName || !ownerName || !email || !password) return;

        btn.disabled = true;
        btn.textContent = 'Creating account…';

        try {
          const res = await fetch('/api/tenant/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ restaurantName, ownerName, email, password, city, plan })
          });
          const data = await res.json();

          if (!res.ok || !data.success) {
            alertBox.textContent = data.error || 'Failed to create account.';
            alertBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Create Account & Enter Restaurant OS →';
            return;
          }

          localStorage.setItem('spicyhub_tenant_token', data.token);
          localStorage.setItem('spicyhub_tenant', JSON.stringify(data.tenant));
          localStorage.removeItem('spicyhub_staff_session');

          btn.textContent = 'Account Created! Redirecting…';
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 300);

        } catch (err) {
          alertBox.textContent = 'Network error. Please try again.';
          alertBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create Account & Enter Restaurant OS →';
        }
      }
    </script>
  </body>
</html>
